[client]

	[client.advanced]

		[client.advanced.autoUpdater]
			# NxEterna: the pack is frozen, never offer to replace the jar
			enableAutoUpdater = false

[common]

	[common.logging]

		[common.logging.warning]
			# NxEterna: no chat lines about the Java garbage collector or about other mods on every join.
			# The pack runs G1 on purpose (measured memory use); players cannot act on these.
			logGarbageCollectorWarning = false
			showModCompatibilityWarningsOnStartup = false
			showSlowWorldGenSettingWarnings = false
